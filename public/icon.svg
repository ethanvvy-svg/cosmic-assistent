<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Reactor Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0891b2" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.8" />
  
  <!-- Radiating Energy Spokes -->
  <g stroke="#06b6d4" stroke-width="4" opacity="0.7">
    <line x1="256" y1="66" x2="256" y2="96" />
    <line x1="256" y1="416" x2="256" y2="446" />
    <line x1="66" y1="256" x2="96" y2="256" />
    <line x1="416" y1="256" x2="446" y2="256" />
    <line x1="122" y1="122" x2="143" y2="143" />
    <line x1="369" y1="369" x2="390" y2="390" />
    <line x1="122" y1="390" x2="143" y2="369" />
    <line x1="369" y1="143" x2="390" y2="122" />
  </g>

  <!-- Inner Arc Core -->
  <circle cx="256" cy="256" r="120" fill="url(#coreGlow)" />
  <circle cx="256" cy="256" r="100" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="8" filter="url(#glow)" />
  
  <!-- Center Triangle / Prism -->
  <polygon points="256,190 310,290 202,290" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linejoin="round" />
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#38bdf8" />
</svg>
